# Dedicated public audio core on Almaz; legacy database and API retained for rollback.
# Runtime credentials and reviewed media are host-owned and never committed.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: core
      POSTGRES_DB: core
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    volumes:
      - ./runtime/database-password:/run/secrets/database-password:ro
      - ./runtime/database:/var/lib/postgresql/data
    networks:
      core:
        aliases: [dedhed-core-db]
    # pg_dump expands retained legacy exports while readers remain connected.
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, pg_isready -U core -d core]
      interval: 5s
      timeout: 5s
      retries: 20
  core:
    image: ${ARCHIVE_ENGINE_IMAGE:?Select the reviewed immutable core pin}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      # Read-only serving role (arkhiv_reader).
      DATABASE_URL_FILE: /run/secrets/database-url
      ARKHIV_COMPATIBILITY: audio
      ARKHIV_PUBLIC: "1"
      VHNESS_COLLECTION: dedhed
      VHNESS_MEDIA: /archive
      VHNESS_DERIVATIVES: /derivatives
    volumes:
      - ./runtime/public-database-url:/run/secrets/database-url:ro
      - ./originals:/archive:ro
      - ${DERIVATIVE_ROOT:?Set the reviewed audio root}:/derivatives:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    networks:
      core: {}
      public-reader:
        aliases: [api, dedhed-core]
  # Operator jobs (migrate, migration apply, reviews) with the owner role; never serves.
  operator:
    profiles: [operator]
    image: ${ARCHIVE_ENGINE_IMAGE:?Select the reviewed immutable core pin}
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      VHNESS_COLLECTIONS: dedhed
      VHNESS_MEDIA: /archive
      VHNESS_DERIVATIVES: /derivatives
      # migrate grants this read-only serving role SELECT on new tables (core 0.4.11+).
      ARKHIV_READER_ROLE: arkhiv_reader
    volumes:
      - ./runtime/database-url:/run/secrets/database-url:ro
      - ./originals:/archive:ro
      - ${DERIVATIVE_ROOT:?Set the reviewed audio root}:/derivatives:ro
      - ./runtime/selection.json:/run/selection.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m]
    networks: [core]
networks:
  core:
    internal: true
    ipam:
      config:
        - subnet: ${CORE_SUBNET:?Select an unused reviewed subnet}
  public-reader:
    name: dedhed-core-public
    external: true
